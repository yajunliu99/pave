<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAVE</title>
<style>
:root{
  --bg:#f5f6f8;--bg2:#eceff4;--panel:#ffffff;--ink:#121620;--muted:#5b6474;--faint:#98a1b0;--line:#e1e5eb;
  --glass:rgba(255,255,255,.8);--shadow:0 12px 32px rgba(18,22,32,.08);--chip:#f1f3f7;
  --p:#3b82f6;--a:#10b3a3;--v:#f2a516;--e:#ef5350;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c11;--bg2:#0f131a;--panel:#131821;--ink:#e9ecf2;--muted:#9aa3b2;--faint:#5f6878;--line:#222936;
  --glass:rgba(13,16,22,.8);--shadow:0 12px 32px rgba(0,0,0,.4);--chip:#1a202b}}
:root[data-theme="dark"]{
  --bg:#0a0c11;--bg2:#0f131a;--panel:#131821;--ink:#e9ecf2;--muted:#9aa3b2;--faint:#5f6878;--line:#222936;
  --glass:rgba(13,16,22,.8);--shadow:0 12px 32px rgba(0,0,0,.4);--chip:#1a202b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--glass);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);z-index:10}
.mark{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex:0 0 auto}
.mark b{font-size:21px;letter-spacing:.06em;font-weight:800}
.mark b span:nth-child(1){color:var(--p)}.mark b span:nth-child(2){color:var(--a)}.mark b span:nth-child(3){color:var(--v)}.mark b span:nth-child(4){color:var(--e)}
.mark small{color:var(--muted);font-size:12.5px;white-space:nowrap}
nav{display:flex;gap:4px;margin-left:auto;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px}
nav a{padding:6px 14px;border-radius:9px;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap}
nav a.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}

/* views */
.view{position:fixed;inset:56px 0 0 0;display:none;outline:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#overview{overflow:auto;background:radial-gradient(1200px 500px at 15% -10%,color-mix(in srgb,var(--p) 10%,transparent),transparent 60%),
  radial-gradient(900px 500px at 95% 0%,color-mix(in srgb,var(--e) 8%,transparent),transparent 55%),var(--bg)}
.wrap{max-width:1140px;margin:0 auto;padding:44px 24px 64px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:10px 0 14px;letter-spacing:-.02em}
h1 .grad{background:linear-gradient(90deg,var(--p),var(--a) 35%,var(--v) 65%,var(--e));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17px;color:var(--muted);max-width:760px;margin:0}

/* harness loop */
.loop{margin:36px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;box-shadow:var(--shadow)}
.loop svg{width:100%;height:auto;display:block}
.loop .stage rect{fill:var(--panel);stroke-width:2}
.loop text{font-family:inherit}
.flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.stages div{font-size:13.5px;color:var(--muted)}
.stages b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

/* apps */
.apps{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.app{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease}
.app:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(18,22,32,.12)}
.app .img{aspect-ratio:16/9;background:var(--bg2) center/cover no-repeat;border-bottom:1px solid var(--line)}
.app .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.app h3{margin:0;font-size:20px;letter-spacing:-.01em}
.app p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chips b{color:var(--ink);font-variant-numeric:tabular-nums}
.open{margin-top:auto;align-self:flex-start;text-decoration:none;font-weight:700;font-size:14px;padding:9px 16px;border-radius:11px;color:#fff}

/* principles */
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:42px 0 12px}
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.principles div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.principles b{display:block;margin-bottom:4px;font-size:14.5px}
.principles span{color:var(--muted);font-size:13.5px}
.foot{margin-top:40px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}

@media (max-width:860px){
  .apps,.principles{grid-template-columns:1fr}
  .stages{grid-template-columns:1fr 1fr}
  .mark small{display:none}
}
@media (max-width:520px){
  .bar{gap:10px;padding:0 12px}
  nav a{padding:6px 10px}
  .wrap{padding:28px 16px 48px}
}
</style>
</head>
<body>
<header class="bar">
  <a class="mark" href="#overview"><b><span>P</span><span>A</span><span>V</span><span>E</span></b><small id="tagline"></small></a>
  <nav id="nav">
    <a href="#overview" data-v="overview">Overview</a>
    <a href="#read" data-v="read">Read</a>
    <a href="#edit" data-v="edit">Edit</a>
  </nav>
  <button class="icon" id="theme" title="Light or dark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<section class="view" id="overview">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1><span class="grad">Perceive · Anchor · Verify · Edit</span></h1>
    <p class="lead" id="lead"></p>

    <div class="loop">
      <svg viewBox="0 0 1000 170" role="img" aria-label="The PAVE harness loop">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--faint)"/></marker>
        </defs>
        <g id="stage-boxes"></g>
        <path class="flow" d="M869 108 C 869 160, 125 160, 125 108" fill="none" stroke="var(--faint)" stroke-width="2" marker-end="url(#ar)"/>
        <text x="500" y="164" text-anchor="middle" font-size="13" fill="var(--muted)" id="loop-back"></text>
      </svg>
      <div class="stages" id="stages"></div>
    </div>

    <div class="apps" id="apps"></div>

    <h2 id="principles-title">Harness principles</h2>
    <div class="principles" id="principles"></div>

    <div class="foot" id="foot"></div>
  </div>
</section>
<section class="view" id="read"><div class="loading">Loading the read example…</div></section>
<section class="view" id="edit"><div class="loading">Loading the edit example…</div></section>

<script type="application/json" id="pave-data">/*__DATA__*/</script>
<script type="application/json" id="app-read">/*__READ__*/</script>
<script type="application/json" id="app-edit">/*__EDIT__*/</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('pave-data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = {P:'var(--p)', A:'var(--a)', V:'var(--v)', E:'var(--e)'};

/* theme, shared with the embedded dashboards */
const store = {get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} }};
const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function themeFrame(f){ try { const doc = f.contentDocument; if (doc && doc.documentElement) doc.documentElement.dataset.theme = dark() ? 'dark' : 'light'; } catch {} }
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; document.querySelectorAll('iframe').forEach(themeFrame); }
applyTheme(store.get('pave-theme', ''));
$('theme').onclick = () => { const t = dark() ? 'light' : 'dark'; applyTheme(t); store.set('pave-theme', t); };

/* overview */
$('tagline').textContent = D.tagline;
$('eyebrow').textContent = D.eyebrow;
$('lead').textContent = D.lead;
const boxes = D.stages.map((s, i) => {
  const x = 14 + i * 248, c = COLORS[s.key];
  return `<g class="stage"><rect x="${x}" y="22" width="222" height="86" rx="18" stroke="${c}"/>
    <text x="${x + 22}" y="62" font-size="30" font-weight="800" fill="${c}">${s.key}</text>
    <text x="${x + 58}" y="58" font-size="17" font-weight="700" fill="var(--ink)">${esc(s.name)}</text>
    <text x="${x + 58}" y="80" font-size="12.5" fill="var(--muted)">${esc(s.short)}</text></g>` +
    (i < 3 ? `<path class="flow" d="M${x + 226} 65 H${x + 244}" stroke="var(--faint)" stroke-width="2" marker-end="url(#ar)"/>` : '');
}).join('');
$('stage-boxes').innerHTML = boxes;
$('loop-back').textContent = D.loop_back;
$('stages').innerHTML = D.stages.map(s => `<div><b style="color:${COLORS[s.key]}">${esc(s.name)}</b>${esc(s.text)}</div>`).join('');
$('apps').innerHTML = D.apps.map(a => `<article class="app">
    <div class="img" style="background-image:url('${a.image}')"></div>
    <div class="body">
      <div class="tag" style="color:${COLORS[a.color]}"><i style="background:${COLORS[a.color]}"></i>${esc(a.kind)}</div>
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.text)}</p>
      <div class="chips">${a.facts.map(([n, l]) => `<span><b>${esc(n)}</b> ${esc(l)}</span>`).join('')}</div>
      <a class="open" href="#${a.view}" style="background:${COLORS[a.color]}">Open the ${esc(a.view)} example →</a>
    </div></article>`).join('');
$('principles').innerHTML = D.principles.map(([t, s]) => `<div><b>${esc(t)}</b><span>${esc(s)}</span></div>`).join('');
$('foot').innerHTML = D.footer;

/* views: the two examples load on first visit, dressed alike: the PAVE skin, the same header with the
   example's harness stages, and a stage letter on each step or tab ("marks": selector -> stage) */
const PAVE_COLORS = {P:'var(--pave-p)', A:'var(--pave-a)', V:'var(--pave-v)', E:'var(--pave-e)'};
function skin(app){
  const marks = Object.entries(app.marks || {});
  return D.skin + (marks.length ? marks.map(([sel]) => sel + '::before').join(',') + '{content:"";margin-right:7px;' +
    'display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;color:#fff;font:800 10px/1 var(--pave-font);' +
    'letter-spacing:0;text-transform:none;vertical-align:1px}' +
    marks.map(([sel, k]) => `${sel}::before{content:"${k}";background:${PAVE_COLORS[k]}}`).join('') : '');
}
function header(app){
  return `<div class="pave-brand"><div class="pave-eyebrow">${esc(app.kind)}</div><h1 class="pave-title">${esc(app.title)}</h1>` +
    `<div class="pave-context">${esc(app.context)}</div></div>` +
    `<div class="pave-rail" aria-label="Harness stages in this example">${D.stages.map((s, i) =>
      `<div class="pave-stage"><i style="background:${PAVE_COLORS[s.key]}">${s.key}</i><b>${esc(s.name)}</b><span title="${esc(app.stages[i])}">${esc(app.stages[i])}</span></div>`).join('')}</div>`;
}
const loaded = {};
function load(view){
  if (loaded[view]) return;
  loaded[view] = true;
  const app = D.frames[view], f = document.createElement('iframe');
  f.title = view === 'read' ? 'PAVE read example' : 'PAVE edit example';
  f.onload = () => {
    themeFrame(f);
    try {  // one theme switch for everything; the edit page's plaque moves next to the title; the read example opens at its intersection
      const doc = f.contentDocument, plaque = doc.querySelector('.plaque'), title = doc.querySelector('.pave-title');
      if (plaque && title && !title.querySelector('.pave-chip')) title.insertAdjacentHTML('beforeend', `<span class="pave-chip">${esc(plaque.textContent)}</span>`);
      const first = doc.querySelector('#list li[data-id]');
      if (first && !doc.querySelector('#list li.sel')) first.click();
    } catch {}
  };
  // An embedded page lives at about:srcdoc, where changing the URL (history.replaceState) throws; let such calls pass.
  const guard = '<script>(function(){["replaceState","pushState"].forEach(function(k){var f=history[k].bind(history);' +
                'history[k]=function(){try{return f.apply(null,arguments)}catch(e){}}})})()<\/script>';
  const dress = `<style id="pave-skin">${skin(app)}#theme{display:none!important}</style>` +
                `<script>document.documentElement.dataset.paveApp=${JSON.stringify(view)};document.documentElement.dataset.theme=${JSON.stringify(dark() ? 'dark' : 'light')}<\/script>`;
  let html = JSON.parse(document.getElementById('app-' + view).textContent).replace(/<head[^>]*>/i, m => m + guard + dress);
  html = html.replace('<header class="top">', m => m + header(app));
  f.srcdoc = html;
  $(view).replaceChildren(f);
}
function show(){
  const view = ['overview', 'read', 'edit'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === view));
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  if (view !== 'overview') load(view);
}
window.addEventListener('hashchange', show);
show();
})();
</script>
</body>
</html>
